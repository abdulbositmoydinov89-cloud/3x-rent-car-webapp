<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3X Rent Car</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12141C; --paper:#F4F5F0; --card:#FFFFFF; --amber:#F5B94D; --route:#2E9E6D;
    --slate:#383B42; --muted:#8A8F98; --line:#ECEAE0; --danger:#C0392B; --danger-bg:#FDECEC;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#15171C; --card:#1D2027; --slate:#E9E7DC; --muted:#8F94A0; --line:#2A2E37;
    }
  }
  :root[data-theme="dark"]{
    --paper:#15171C; --card:#1D2027; --slate:#E9E7DC; --muted:#8F94A0; --line:#2A2E37;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); font-family:'Manrope',system-ui,sans-serif; color:var(--slate);}
  a{text-decoration:none; color:inherit;}
  button{font-family:inherit; cursor:pointer;}
  input{font-family:inherit;}
  ::-webkit-scrollbar{width:0; height:0;}
  .disp{font-family:'Unbounded',sans-serif;}
  #shell{max-width:460px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; background:var(--paper); position:relative; overflow-x:hidden;}
  #screen{flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;}
  .header{background:var(--ink); padding:22px 20px;}
  .chip{padding:9px 16px; border-radius:100px; font-size:13px; font-weight:600; border:1px solid var(--line); background:var(--card); color:var(--slate); flex-shrink:0;}
  .chip.active{background:var(--amber); border-color:var(--amber); color:var(--ink);}
  .card{background:var(--card); border:1px solid var(--line); border-radius:16px;}
  .btn-primary{background:var(--amber); color:var(--ink); border:none; border-radius:14px; padding:15px; font-weight:700; font-size:14px; text-align:center;}
  .btn-confirm{background:var(--route); color:#fff; border:none; border-radius:14px; padding:15px; font-weight:700; font-size:14px; text-align:center;}
  .navbar{flex-shrink:0; background:var(--ink); border-radius:20px 20px 0 0; padding:12px 8px calc(18px + env(safe-area-inset-bottom)) 8px; display:flex; align-items:center; justify-content:space-around;}
  .navitem{display:flex; flex-direction:column; align-items:center; gap:4px; padding:4px 10px; background:none; border:none;}
  .navitem svg{stroke:#8A8F98;} .navitem span{font-size:10.5px; font-weight:600; color:#8A8F98;}
  .navitem.active svg{stroke:var(--amber);} .navitem.active span{color:var(--amber); font-weight:700;}
  .toast{position:fixed; left:20px; right:20px; bottom:110px; max-width:420px; margin:0 auto; background:var(--ink); color:#F5F5F2; padding:14px 16px; border-radius:14px; font-size:13px; font-weight:600; text-align:center; box-shadow:0 12px 24px -8px rgba(0,0,0,.35); transform:translateY(20px); opacity:0; transition:transform .25s ease, opacity .25s ease; pointer-events:none; z-index:50;}
  .toast.show{transform:translateY(0); opacity:1;}
  .field label{font-size:11px; color:var(--muted);}
  .field input{width:100%; margin-top:5px; padding:13px 14px; border-radius:12px; border:1px solid var(--line); background:var(--card); font-size:14px; color:var(--slate);}
  .badge{display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:100px; font-size:11px; font-weight:700;}
</style>
</head>
<body>
<div id="shell">
  <div id="screen"></div>
  <div id="nav"></div>
</div>
<div id="toast" class="toast"></div>

<script>
/* ---------- Telegram WebApp bridge (safe no-op outside Telegram) ---------- */
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg) {
  tg.ready();
  tg.expand();
  if (tg.colorScheme) document.documentElement.setAttribute('data-theme', tg.colorScheme);
  tg.onEvent && tg.onEvent('themeChanged', () => {
    document.documentElement.setAttribute('data-theme', tg.colorScheme);
  });
}
function haptic(kind){ if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred(kind || 'light'); }

/* ---------- Data ---------- */
const CARS = [
  { id:'nexia',  name:"Chevrolet Nexia",    company:"EasyDrive", rating:"4.8", pricePerDay:180000, specs:"Avtomat · Benzin · 5 o'rin", tint:"#DCE7DD" },
  { id:'cobalt', name:"Chevrolet Cobalt",   company:"GoRent",    rating:"4.6", pricePerDay:210000, specs:"Mexanika · Benzin · 5 o'rin", tint:"#DCE3EF" },
  { id:'spark',  name:"Chevrolet Spark",    company:"RentUZ",    rating:"4.5", pricePerDay:140000, specs:"Avtomat · Benzin · 4 o'rin", tint:"#EFE1CB" },
  { id:'malibu', name:"Chevrolet Malibu 2", company:"AvtoPro",   rating:"4.9", pricePerDay:320000, specs:"Avtomat · Benzin · 5 o'rin", tint:"#EAD9E1" },
  { id:'damas',  name:"Damas",              company:"EasyDrive", rating:"4.3", pricePerDay:260000, specs:"Mexanika · Benzin · 7 o'rin", tint:"#E6E2D6" },
];
const RENT_DAYS = 3;
const SERVICE_FEE = 25000;

/* ---------- State ---------- */
let state = {
  view: 'home',
  selectedCarId: null,
  driver: { name:'Aziz Karimov', phone:'+998 90 123 45 67', license:'' },
  payment: 'cash',
  bookings: safeLoad(),
};
function safeLoad(){
  try { return JSON.parse(localStorage.getItem('3xrc_bookings') || '[]'); }
  catch(e){ return []; }
}
function persist(){
  try { localStorage.setItem('3xrc_bookings', JSON.stringify(state.bookings)); } catch(e){}
}
function money(n){ return n.toLocaleString('uz-UZ').replace(/,/g,' '); }
function goto(view){ state.view = view; render(); window.scrollTo(0,0); }
function selectedCar(){ return CARS.find(c => c.id === state.selectedCarId) || CARS[0]; }
function total(car){ return car.pricePerDay * RENT_DAYS + SERVICE_FEE; }

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ---------- Icons ---------- */
const ICON = {
  bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>',
  pin:'<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',
  chevronDown:'<path d="m6 9 6 6 6-6"/>',
  chevronRight:'<path d="m9 18 6-6-6-6"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
  star:'<path d="m12 2 3.09 6.26L22 9.27l-5 4.87L18.18 21 12 17.77 5.82 21 7 14.14l-5-4.87 6.91-1.01L12 2z"/>',
  car:'<path d="M5 13.5 6.4 9a2 2 0 0 1 1.9-1.4h7.4A2 2 0 0 1 17.6 9l1.4 4.5"/><path d="M3.5 13.5h17a1 1 0 0 1 1 1V17a1 1 0 0 1-1 1h-1.2"/><path d="M4.7 18H3.5a1 1 0 0 1-1-1v-2.5a1 1 0 0 1 1-1"/><circle cx="7.5" cy="18" r="1.6"/><circle cx="16.5" cy="18" r="1.6"/>',
  back:'<path d="m15 18-6-6 6-6"/>',
  heart:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/>',
  chat:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  card:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>',
  home:'<path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/>',
  bookings:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M8 3v4M16 3v4"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4.5 5-6 8-6s6.5 1.5 8 6"/>',
  gear:'<circle cx="12" cy="15" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.6V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.6 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.6 1Z"/>',
};
function svg(name, size, color, fill){
  return `<svg width="${size||18}" height="${size||18}" viewBox="0 0 24 24" fill="${fill||'none'}" stroke="${color||'currentColor'}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${ICON[name]}</svg>`;
}

/* ---------- Screens ---------- */
function screenHome(){
  return `
  <div class="header">
    <div style="display:flex; align-items:center; justify-content:space-between;">
      <div class="disp" style="font-weight:700; font-size:18px; color:#F5F5F2; letter-spacing:-.02em;">3X&nbsp;Rent&nbsp;Car</div>
      <button style="width:40px; height:40px; border-radius:12px; background:#1D202B; border:none; display:flex; align-items:center; justify-content:center;">${svg('bell',18,'#E9E4D8')}</button>
    </div>
    <div style="margin-top:18px; font-size:13px; color:#8A8F98;">Xayrli kun, ${state.driver.name.split(' ')[0]}</div>
    <div style="margin-top:6px; display:flex; align-items:center; gap:6px;">
      ${svg('pin',16,'#F5B94D')}
      <span class="disp" style="font-weight:600; font-size:15px; color:#F5F5F2;">Toshkent shahri</span>
      ${svg('chevronDown',16,'#8A8F98')}
    </div>
  </div>

  <div class="card" style="margin:-38px 20px 0 20px; box-shadow:0 12px 24px -8px rgba(18,20,28,.22); overflow:hidden;">
    <div style="padding:18px;">
      <div style="display:flex; align-items:center; gap:14px;">
        <div style="width:34px; display:flex; flex-direction:column; align-items:center; gap:2px;">
          <div style="width:8px; height:8px; border-radius:50%; background:var(--amber);"></div>
          <div style="width:1px; height:24px; background:var(--line);"></div>
          <div style="width:8px; height:8px; border-radius:50%; background:var(--route);"></div>
        </div>
        <div style="flex-grow:1; display:flex; flex-direction:column; gap:12px;">
          <div><div style="font-size:11px; color:var(--muted);">Olib ketish</div><div class="disp" style="font-weight:600; font-size:14px; margin-top:2px;">Toshkent, Yunusobod</div></div>
          <div><div style="font-size:11px; color:var(--muted);">Qaytarish</div><div class="disp" style="font-weight:600; font-size:14px; margin-top:2px;">Toshkent, Chilonzor</div></div>
        </div>
      </div>
    </div>
    <div style="border-top:1px dashed var(--line); margin:0 18px;"></div>
    <div style="padding:14px 18px 18px 18px; display:flex; align-items:center; gap:12px;">
      <div style="flex-grow:1;"><div style="font-size:11px; color:var(--muted);">Sana</div><div style="font-weight:700; font-size:14px; margin-top:2px;">18-sen — 21-sen</div></div>
      <button data-action="toast" data-msg="Filtrlar demo rejimida ishlamaydi" style="flex-shrink:0; display:flex; align-items:center; gap:8px; background:var(--amber); border:none; padding:12px 20px; border-radius:14px;">
        ${svg('search',16,'#12141C')}<span class="disp" style="font-weight:700; font-size:13px; color:#12141C;">Qidirish</span>
      </button>
    </div>
  </div>

  <div style="padding:22px 20px 24px 20px;">
    <div style="display:flex; gap:8px; overflow-x:auto;">
      <div class="chip active">Barchasi</div>
      <div class="chip">Ekonom</div>
      <div class="chip">Komfort</div>
      <div class="chip">Krossover</div>
      <div class="chip">Mikroavtobus</div>
    </div>

    <div style="display:flex; align-items:baseline; justify-content:space-between; margin-top:24px; margin-bottom:14px;">
      <div class="disp" style="font-weight:700; font-size:16px;">Mavjud avtomobillar</div>
      <div style="font-size:12px; color:var(--muted);">${CARS.length} ta natija</div>
    </div>

    <div style="display:flex; flex-direction:column; gap:12px;">
      ${CARS.map(car => `
        <button data-action="open-car" data-id="${car.id}" class="card" style="display:flex; gap:14px; padding:12px; width:100%; text-align:left;">
          <div style="flex-shrink:0; width:84px; height:84px; border-radius:14px; background:${car.tint}; display:flex; align-items:center; justify-content:center;">${svg('car',42,'#12141C')}</div>
          <div style="flex-grow:1; min-width:0; display:flex; flex-direction:column; justify-content:space-between;">
            <div>
              <div style="display:flex; align-items:center; justify-content:space-between; gap:8px;">
                <div style="font-weight:700; font-size:15px;">${car.name}</div>
                <div style="flex-shrink:0; display:flex; align-items:center; gap:3px; background:var(--paper); padding:3px 8px; border-radius:100px;">${svg('star',11,'none','#F5B94D')}<span style="font-size:11px; font-weight:700;">${car.rating}</span></div>
              </div>
              <div style="font-size:12px; color:var(--muted); margin-top:2px;">${car.company}</div>
            </div>
            <div style="display:flex; align-items:center; justify-content:space-between; margin-top:8px;">
              <div style="font-size:11px; color:var(--muted);">${car.specs}</div>
              <div><span class="disp" style="font-weight:700; font-size:14px; color:var(--route);">${money(car.pricePerDay)}</span><span style="font-size:11px; color:var(--muted);">&nbsp;so'm/kun</span></div>
            </div>
          </div>
        </button>
      `).join('')}
    </div>
  </div>`;
}

function screenCarDetails(){
  const car = selectedCar();
  const grand = total(car);
  return `
  <div style="position:relative; height:260px; background:${car.tint}; display:flex; align-items:center; justify-content:center;">
    <button data-action="goto" data-view="home" aria-label="Orqaga" style="position:absolute; top:20px; left:20px; width:40px; height:40px; border-radius:12px; background:rgba(18,20,28,.55); border:none; display:flex; align-items:center; justify-content:center;">${svg('back',18,'#fff')}</button>
    <button data-action="toast" data-msg="Sevimlilarga qo'shildi" aria-label="Sevimli" style="position:absolute; top:20px; right:20px; width:40px; height:40px; border-radius:12px; background:rgba(18,20,28,.55); border:none; display:flex; align-items:center; justify-content:center;">${svg('heart',18,'#fff')}</button>
    ${svg('car',150,'#12141C')}
  </div>
  <div style="padding:22px 20px 0 20px;">
    <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:12px;">
      <div>
        <div class="disp" style="font-weight:700; font-size:20px;">${car.name}</div>
        <div style="display:flex; align-items:center; gap:5px; margin-top:6px;">${svg('star',13,'none','#F5B94D')}<span style="font-size:13px; font-weight:700;">${car.rating}</span><span style="font-size:13px; color:var(--muted);">&nbsp;· 96 ta sharh · ${car.company}</span></div>
      </div>
      <div style="text-align:right; flex-shrink:0;"><div class="disp" style="font-weight:700; font-size:18px; color:var(--route);">${money(car.pricePerDay)}</div><div style="font-size:11px; color:var(--muted);">so'm / kun</div></div>
    </div>
    <div style="display:flex; gap:8px; margin-top:18px; flex-wrap:wrap;">
      ${["Avtomat","Benzin","5 o'rin","Konditsioner"].map(s=>`<div class="card" style="padding:8px 12px;"><span style="font-size:12px; font-weight:600;">${s}</span></div>`).join('')}
    </div>
    <div class="card" style="margin-top:22px; display:flex; align-items:center; gap:12px; padding:14px;">
      <div style="width:44px; height:44px; border-radius:12px; background:var(--ink); flex-shrink:0; display:flex; align-items:center; justify-content:center;"><span class="disp" style="font-weight:700; font-size:14px; color:var(--amber);">${car.company.slice(0,2).toUpperCase()}</span></div>
      <div style="flex-grow:1;"><div style="font-weight:700; font-size:14px;">${car.company}</div><div style="font-size:12px; color:var(--muted); margin-top:1px;">128 ta avtomobil · 2019 yildan</div></div>
      <button data-action="toast" data-msg="Demo: chat ochilmaydi" style="width:38px; height:38px; border-radius:11px; background:var(--paper); border:none; display:flex; align-items:center; justify-content:center;">${svg('chat',16)}</button>
    </div>
    <div style="margin-top:22px;"><div class="disp" style="font-weight:700; font-size:14px;">Tavsif</div><div style="font-size:13px; line-height:1.6; color:var(--muted); margin-top:8px;">Shahar ichida va yaqin safarlarga qulay, tejamkor sedan. To'liq sug'urta va cheklanmagan masofa narxga kiritilgan. Yetkazib berish — bepul.</div></div>
    <div style="margin-top:22px;">
      <div class="disp" style="font-weight:700; font-size:14px;">Narx tafsilotlari</div>
      <div style="margin-top:10px; display:flex; flex-direction:column; gap:10px;">
        <div style="display:flex; justify-content:space-between; font-size:13px;"><span style="color:var(--muted);">${RENT_DAYS} kun × ${money(car.pricePerDay)} so'm</span><span style="font-weight:600;">${money(car.pricePerDay*RENT_DAYS)} so'm</span></div>
        <div style="display:flex; justify-content:space-between; font-size:13px;"><span style="color:var(--muted);">Xizmat haqi</span><span style="font-weight:600;">${money(SERVICE_FEE)} so'm</span></div>
        <div style="border-top:1px dashed var(--line); margin-top:2px; padding-top:12px; display:flex; justify-content:space-between;"><span style="font-size:13px; font-weight:700;">Jami</span><span class="disp" style="font-weight:700; font-size:15px;">${money(grand)} so'm</span></div>
      </div>
    </div>
    <div style="height:110px;"></div>
  </div>
  <div style="position:sticky; bottom:0; background:var(--card); border-top:1px solid var(--line); padding:14px 20px 20px 20px; display:flex; align-items:center; gap:14px;">
    <div><div style="font-size:11px; color:var(--muted);">Jami narx</div><div class="disp" style="font-weight:700; font-size:17px;">${money(grand)} so'm</div></div>
    <button data-action="goto" data-view="booking" class="btn-primary" style="flex-grow:1;">Band qilish</button>
  </div>`;
}

function screenBooking(){
  const car = selectedCar();
  const grand = total(car);
  const methods = [
    { id:'cash', label:"Naqd pul (yetkazib berishda)" },
    { id:'card', label:"Uzcard / Humo" },
    { id:'payme', label:"Payme" },
  ];
  return `
  <div class="header" style="display:flex; align-items:center; gap:14px; padding:20px;">
    <button data-action="goto" data-view="car" aria-label="Orqaga" style="width:38px; height:38px; border-radius:11px; background:#1D202B; border:none; display:flex; align-items:center; justify-content:center;">${svg('back',17,'#F5F5F2')}</button>
    <div class="disp" style="font-weight:700; font-size:16px; color:#F5F5F2;">Band qilish</div>
  </div>
  <div style="padding:20px;">
    <div class="card" style="display:flex; gap:14px; padding:14px;">
      <div style="width:64px; height:64px; border-radius:12px; background:${car.tint}; flex-shrink:0; display:flex; align-items:center; justify-content:center;">${svg('car',34,'#12141C')}</div>
      <div style="flex-grow:1;"><div style="font-weight:700; font-size:14px;">${car.name}</div><div style="font-size:12px; color:var(--muted); margin-top:2px;">${car.company} · ${car.specs}</div><div style="font-size:12px; color:var(--muted); margin-top:2px;">18-sen — 21-sen · ${RENT_DAYS} kun</div></div>
    </div>

    <div style="margin-top:22px;">
      <div class="disp" style="font-weight:700; font-size:14px;">Haydovchi ma'lumotlari</div>
      <div style="margin-top:12px; display:flex; flex-direction:column; gap:10px;">
        <div class="field"><label for="f-name">To'liq ism</label><input id="f-name" data-bind="name" type="text" value="${state.driver.name}"></div>
        <div class="field"><label for="f-phone">Telefon raqami</label><input id="f-phone" data-bind="phone" type="tel" value="${state.driver.phone}"></div>
        <div class="field"><label for="f-license">Haydovchilik guvohnomasi</label><input id="f-license" data-bind="license" type="text" placeholder="AB 1234567" value="${state.driver.license}"></div>
      </div>
    </div>

    <div style="margin-top:22px;">
      <div class="disp" style="font-weight:700; font-size:14px;">To'lov usuli</div>
      <div style="margin-top:12px; display:flex; flex-direction:column; gap:10px;">
        ${methods.map(m => `
          <button data-action="pick-payment" data-id="${m.id}" class="card" style="display:flex; align-items:center; gap:12px; padding:13px 14px; width:100%; text-align:left; border-color:${state.payment===m.id?'var(--amber)':'var(--line)'};">
            <div style="width:34px; height:34px; border-radius:10px; background:var(--paper); display:flex; align-items:center; justify-content:center; flex-shrink:0;">${svg('card',17)}</div>
            <span style="flex-grow:1; font-size:13px; font-weight:600;">${m.label}</span>
            <div style="width:20px; height:20px; border-radius:50%; border:2px solid ${state.payment===m.id?'var(--amber)':'var(--line)'}; flex-shrink:0; display:flex; align-items:center; justify-content:center;">${state.payment===m.id?'<div style="width:10px;height:10px;border-radius:50%;background:var(--amber);"></div>':''}</div>
          </button>
        `).join('')}
      </div>
    </div>
    <div style="height:24px;"></div>
  </div>
  <div style="position:sticky; bottom:0; background:var(--card); border-top:1px solid var(--line); padding:14px 20px 20px 20px; display:flex; align-items:center; gap:14px;">
    <div><div style="font-size:11px; color:var(--muted);">Jami narx</div><div class="disp" style="font-weight:700; font-size:17px;">${money(grand)} so'm</div></div>
    <button data-action="confirm-booking" class="btn-confirm" style="flex-grow:1;">Tasdiqlash va to'lash</button>
  </div>`;
}

function screenBookings(){
  const list = state.bookings.slice().reverse();
  return `
  <div class="header">
    <div class="disp" style="font-weight:700; font-size:18px; color:#F5F5F2;">Buyurtmalarim</div>
    <div style="display:flex; gap:8px; margin-top:16px;">
      <div style="padding:9px 16px; border-radius:100px; background:var(--amber);"><span style="font-size:13px; font-weight:700; color:#12141C;">Faol · ${list.length}</span></div>
      <div style="padding:9px 16px; border-radius:100px; background:#1D202B;"><span style="font-size:13px; font-weight:600; color:#8A8F98;">Tarix</span></div>
    </div>
  </div>
  <div style="padding:20px;">
    ${list.length === 0 ? `
      <div style="text-align:center; padding:60px 20px; color:var(--muted);">
        <div style="font-size:14px;">Hali buyurtmalar yo'q</div>
        <button data-action="goto" data-view="home" class="btn-primary" style="margin-top:16px; display:inline-block; padding:12px 22px;">Avtomobil tanlash</button>
      </div>` : `
      <div style="display:flex; flex-direction:column; gap:14px;">
        ${list.map(b => `
          <div class="card" style="padding:14px;">
            <div class="badge" style="background:#E7F4EE; color:#227A55;"><div style="width:6px; height:6px; border-radius:50%; background:#2E9E6D;"></div>Tasdiqlangan</div>
            <div style="display:flex; gap:14px; margin-top:12px;">
              <div style="width:64px; height:64px; border-radius:12px; background:${b.tint}; flex-shrink:0; display:flex; align-items:center; justify-content:center;">${svg('car',34,'#12141C')}</div>
              <div style="flex-grow:1;"><div style="font-weight:700; font-size:14px;">${b.carName}</div><div style="font-size:12px; color:var(--muted); margin-top:2px;">${b.company}</div><div style="font-size:12px; color:var(--muted); margin-top:2px;">${b.dates} · ${RENT_DAYS} kun</div></div>
            </div>
            <div style="display:flex; align-items:center; justify-content:space-between; margin-top:12px; border-top:1px dashed var(--line); padding-top:12px;">
              <span class="disp" style="font-weight:700; font-size:14px;">${money(b.total)} so'm</span>
              <span style="font-size:12px; color:var(--muted);">${b.driverName}</span>
            </div>
          </div>
        `).join('')}
      </div>`}
  </div>`;
}

function screenProfile(){
  const menu = [
    { label:"Shaxsiy ma'lumotlar", icon:'user' },
    { label:"Haydovchilik hujjatlari", icon:'card' },
    { label:"To'lov usullari", icon:'card' },
    { label:"Sevimlilar", icon:'heart' },
    { label:"Yordam markazi", icon:'chat' },
    { label:"Sozlamalar", icon:'gear' },
  ];
  return `
  <div class="header" style="padding:28px 20px 44px 20px; display:flex; align-items:center; gap:14px;">
    <div style="width:56px; height:56px; border-radius:16px; background:var(--amber); display:flex; align-items:center; justify-content:center; flex-shrink:0;"><span class="disp" style="font-weight:800; font-size:18px; color:#12141C;">${state.driver.name.split(' ').map(p=>p[0]).slice(0,2).join('')}</span></div>
    <div><div class="disp" style="font-weight:700; font-size:17px; color:#F5F5F2;">${state.driver.name}</div><div style="font-size:12px; color:#8A8F98; margin-top:3px;">${state.driver.phone}</div></div>
  </div>
  <div class="card" style="margin:-26px 20px 0 20px; box-shadow:0 12px 24px -8px rgba(18,20,28,.18); display:flex;">
    <div style="flex:1; text-align:center; padding:16px 8px; border-right:1px solid var(--line);"><div class="disp" style="font-weight:700; font-size:17px;">${state.bookings.length}</div><div style="font-size:11px; color:var(--muted); margin-top:2px;">Ijaralar</div></div>
    <div style="flex:1; text-align:center; padding:16px 8px; border-right:1px solid var(--line);"><div class="disp" style="font-weight:700; font-size:17px;">4.9</div><div style="font-size:11px; color:var(--muted); margin-top:2px;">Reyting</div></div>
    <div style="flex:1; text-align:center; padding:16px 8px;"><div class="disp" style="font-weight:700; font-size:17px;">2022</div><div style="font-size:11px; color:var(--muted); margin-top:2px;">A'zo bo'lgan</div></div>
  </div>
  <div style="padding:22px 20px 24px 20px;">
    <div style="display:flex; flex-direction:column; gap:10px;">
      ${menu.map(m => `<button data-action="toast" data-msg="Demo rejimida ishlamaydi" class="card" style="display:flex; align-items:center; gap:14px; padding:14px; width:100%; text-align:left;"><div style="width:38px; height:38px; border-radius:11px; background:var(--paper); display:flex; align-items:center; justify-content:center; flex-shrink:0;">${svg(m.icon,17)}</div><span style="flex-grow:1; font-size:13.5px; font-weight:600;">${m.label}</span>${svg('chevronRight',16,'#C9C6BA')}</button>`).join('')}
    </div>
    <button data-action="toast" data-msg="Demo rejimida ishlamaydi" style="width:100%; margin-top:20px; padding:15px; border-radius:14px; background:var(--danger-bg); border:none;"><span style="font-size:13.5px; font-weight:700; color:var(--danger);">Chiqish</span></button>
  </div>`;
}

/* ---------- Render ---------- */
function render(){
  const screens = { home:screenHome, car:screenCarDetails, booking:screenBooking, bookings:screenBookings, profile:screenProfile };
  document.getElementById('screen').innerHTML = screens[state.view]();
  document.getElementById('nav').innerHTML = renderNav();
  syncTelegramChrome();
}
function renderNav(){
  const tabs = [
    { id:'home', label:'Bosh sahifa', icon:'home' },
    { id:'search', label:'Qidiruv', icon:'search' },
    { id:'bookings', label:'Buyurtmalar', icon:'bookings' },
    { id:'profile', label:'Profil', icon:'user' },
  ];
  const activeId = state.view === 'car' || state.view === 'booking' ? 'home' : state.view;
  return `<div class="navbar">${tabs.map(t => `
    <button class="navitem ${t.id===activeId?'active':''}" data-action="goto" data-view="${t.id==='search'?'home':t.id}">${svg(t.icon,20,t.id===activeId?'var(--amber)':'#8A8F98')}<span>${t.label}</span></button>
  `).join('')}</div>`;
}

/* Telegram chrome: back button + main button follow the current screen */
function syncTelegramChrome(){
  if (!tg) return;
  if (state.view === 'car' || state.view === 'booking') {
    tg.BackButton.show();
  } else {
    tg.BackButton.hide();
  }
  if (state.view === 'booking') {
    tg.MainButton.setText(`Tasdiqlash · ${money(total(selectedCar()))} so'm`);
    tg.MainButton.show();
  } else {
    tg.MainButton.hide();
  }
}
if (tg) {
  tg.BackButton.onClick(() => {
    if (state.view === 'booking') goto('car');
    else if (state.view === 'car') goto('home');
  });
  tg.MainButton.onClick(() => confirmBooking());
}

/* ---------- Actions ---------- */
function confirmBooking(){
  const car = selectedCar();
  const booking = {
    carId: car.id, carName: car.name, company: car.company, tint: car.tint,
    dates: "18-sen — 21-sen", total: total(car), payment: state.payment,
    driverName: state.driver.name, createdAt: Date.now(),
  };
  state.bookings.push(booking);
  persist();
  haptic('medium');
  if (tg && tg.sendData) {
    try { tg.sendData(JSON.stringify(booking)); } catch(e){}
  }
  showToast("Buyurtma tasdiqlandi ✓");
  goto('bookings');
}

document.getElementById('shell').addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;
  if (action === 'goto') { haptic('light'); goto(el.dataset.view); }
  if (action === 'open-car') { state.selectedCarId = el.dataset.id; haptic('light'); goto('car'); }
  if (action === 'pick-payment') { state.payment = el.dataset.id; render(); }
  if (action === 'confirm-booking') { confirmBooking(); }
  if (action === 'toast') { showToast(el.dataset.msg); }
});
document.getElementById('shell').addEventListener('input', (e) => {
  const bind = e.target.dataset && e.target.dataset.bind;
  if (bind) state.driver[bind] = e.target.value;
});

render();
</script>
</body>
</html>
